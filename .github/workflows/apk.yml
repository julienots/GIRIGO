name: Construire l'APK Android
on:
  push:
    branches: [main, master, ccr-f15f6d81-tgt4n7]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Préparer le projet Android
        run: |
          npm run www
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
          # icône Girigo (mains jointes), icône de notification et écran de démarrage noir
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-res/* android/app/src/main/res/
          npx cap sync android
      - name: Compiler
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk girigo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: girigo-apk
          path: girigo.apk
      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Girigo — APK Android
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: girigo.apk
          body: |
            Télécharge **girigo.apk** ci-dessous sur ton téléphone Android, ouvre-le,
            puis autorise « Installer des applis inconnues » si Android le demande.
